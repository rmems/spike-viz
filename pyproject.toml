[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spike-viz"
version = "0.1.0a0"
description = "PyTorch + CUDA toolkit for visualizing spiking neural network encodings and activity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raul Montoya Cardenas" }]
keywords = ["snn", "spikes", "visualization", "pytorch", "neuromorphic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/rmems/spike-viz"
Issues = "https://github.com/rmems/spike-viz/issues"
Charter = "https://github.com/rmems/spike-viz/blob/main/docs/CHARTER.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
